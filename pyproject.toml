[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feixiga-trainplat_jd193"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告大模型训练平台工程师·分块策略对召回的影响相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "feixiga" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://feixiga.github.io"
Repository = "https://github.com/feixiga/trainplat_jd193"
Issues = "https://github.com/feixiga/trainplat_jd193/issues"

[project.scripts]
trainplat_jd193 = "trainplat_jd193:main"

[tool.setuptools]
py-modules = ["trainplat_jd193"]
